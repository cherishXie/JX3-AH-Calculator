name: Update JX3 prices

on:
  schedule:
    # 每天 09:10 Asia/Shanghai (01:10 UTC)
    - cron: '10 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update prices and rebuild minitool zip
        run: ./scripts/update-prices.sh

      - name: Commit changes
        run: |
          git config user.name "jx3-price-bot"
          git config user.email "jx3-price-bot@users.noreply.github.com"
          git add assets/data.js miniapp/src/shared/catalog.json minitool/assets/data.js scripts/jx3-item-map.json
          git add "剑网三物价助手-minitool.zip"
          if git diff --cached --quiet; then
            echo "No price changes"
          else
            git commit -m "chore: update JX3BOX prices"
            git push
          fi

      - name: Upload minitool artifact
        uses: actions/upload-artifact@v4
        with:
          name: jx3-minitool
          path: "剑网三物价助手-minitool.zip"
