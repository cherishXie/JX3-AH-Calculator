name: Update JX3 prices

on:
  # 主定时：Cloudflare Worker 全天每 30 分钟 :06 / :36 触发 workflow_dispatch。
  # 兜底：GitHub schedule 每 2 小时 :31（UTC）运行；外部调度失效时仍会执行。
  workflow_dispatch:
  schedule:
    - cron: '31 */2 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update-jx3-prices.mjs'
      - 'scripts/lib/miniapp-catalog.cjs'
      - 'scripts/test-miniapp-catalog.cjs'
      - 'scripts/jx3-item-map.json'
      - '.github/workflows/update-jx3-prices.yml'

permissions:
  contents: write

concurrency:
  group: update-jx3-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate price history script
        run: |
          node scripts/test-price-history.mjs
          node scripts/test-price-trends.mjs

      - name: Update prices and sync miniapp core catalog
        run: ./scripts/update-prices.sh --web-only

      - name: Test miniapp core catalog
        run: node scripts/test-miniapp-catalog.cjs

      - name: Commit changes
        run: |
          git config user.name "jx3-price-bot"
          git config user.email "jx3-price-bot@users.noreply.github.com"

          stage() {
            git add assets/data.js miniapp/src/shared/catalog.json miniapp/src/market/data/market-catalog.json minitool/assets/data.js minitool/assets/price-history.js scripts/jx3-item-map.json data/price-history data/price-trends
            git add -A "剑网三物价助手-minitool.zip"
          }
          commit_if_any() {
            stage
            if git diff --cached --quiet; then return 1; fi
            git commit -m "chore: update JX3BOX prices"
          }

          if ! commit_if_any; then
            echo "No price changes"
            exit 0
          fi

          # 并发场景：另一个价格运行/changelog 可能同时改同一天的 history 和 zip，
          # rebase 会冲突。冲突时丢弃本地提交、在新 main 上重新抓价生成，而不是重放旧数据。
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push; then
                echo "已推送（第 $i 次尝试）"
                exit 0
              fi
              echo "push 被拒，$i/5，5 秒后重试"
            else
              echo "rebase 冲突，$i/5：回到最新 main 重新生成价格"
              git rebase --abort || true
              git reset --hard origin/main
              ./scripts/update-prices.sh --web-only
              if ! commit_if_any; then
                echo "重新生成后无差异"
                exit 0
              fi
            fi
            sleep 5
          done
          exit 1

      - name: Build and sync cloud prices
        # 小程序云同步失败不应阻塞价格提交后的 dev 同步与小工具上传
        continue-on-error: true
        env:
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_APPSECRET: ${{ secrets.WX_APPSECRET }}
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: |
          if [ -z "$WX_APPID" ] || [ -z "$WX_APPSECRET" ] || [ -z "$TCB_ENV_ID" ]; then
            echo "WX_APPID / WX_APPSECRET / TCB_ENV_ID 未配置，跳过云同步。"
            exit 0
          fi
          node miniapp/scripts/build-remote-prices.mjs
          node miniapp/scripts/sync-cloudbase-prices.mjs
          node miniapp/scripts/sync-cloudbase-history.mjs

      - name: Upload minitool artifact
        uses: actions/upload-artifact@v4
        with:
          name: jx3-minitool
          path: "剑网三物价助手-minitool.zip"

      # 价格机器人也要把行情同步到 dev 预览。
      # dev 的目录（物品/配方）比 main 新，不能直接复制 main 的 data.js，
      # 所以切到 dev 分支后重跑一次更新脚本：以 dev 自己的 data.js 为底，
      # 只把价格写进去。只提交数据文件，不碰任何网页代码。
      - name: Sync prices to dev
        run: |
          # 前面的云同步可能改了工作区，切分支前先清掉未提交改动（main 的提交已完成）
          git reset --hard HEAD
          git fetch origin dev
          git checkout -B dev origin/dev
          ./scripts/update-prices.sh --web-only
          git add assets/data.js miniapp/src/shared/catalog.json miniapp/src/market/data/market-catalog.json minitool/assets/data.js minitool/assets/price-history.js scripts/jx3-item-map.json data/price-history data/price-trends
          if git diff --cached --quiet; then
            echo "No dev price changes"
          else
            git commit -m "chore: update JX3BOX prices"
            git push origin dev
          fi
