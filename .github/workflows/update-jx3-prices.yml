name: Update JX3 prices

on:
  # 直接调度更新；price-schedule.yml 在 30 分钟后检查并补跑。
  schedule:
    # 北京时间 08:17–22:17，每 2 小时；避开整点高峰。
    - cron: '17 0,2,4,6,8,10,12,14 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update-jx3-prices.mjs'
      - 'scripts/jx3-item-map.json'
      - '.github/workflows/update-jx3-prices.yml'

permissions:
  contents: write

concurrency:
  group: update-jx3-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check update window
        id: window
        run: |
          hour=$(TZ=Asia/Shanghai date +%H)
          hour=$((10#$hour))
          if [ "$hour" -lt 8 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Outside 08:00-24:00 Asia/Shanghai (hour=$hour); skip."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Inside update window (hour=$hour)."
          fi

      - name: Update prices and rebuild minitool zip
        if: steps.window.outputs.skip != 'true'
        run: ./scripts/update-prices.sh

      - name: Commit changes
        if: steps.window.outputs.skip != 'true'
        run: |
          git config user.name "jx3-price-bot"
          git config user.email "jx3-price-bot@users.noreply.github.com"
          git add assets/data.js miniapp/src/shared/catalog.json minitool/assets/data.js scripts/jx3-item-map.json
          git add "剑网三物价助手-minitool.zip"
          if git diff --cached --quiet; then
            echo "No price changes"
          else
            git commit -m "chore: update JX3BOX prices"
            git push
          fi

      - name: Build and sync cloud prices
        if: steps.window.outputs.skip != 'true'
        env:
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_APPSECRET: ${{ secrets.WX_APPSECRET }}
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: |
          if [ -z "$WX_APPID" ] || [ -z "$WX_APPSECRET" ] || [ -z "$TCB_ENV_ID" ]; then
            echo "WX_APPID / WX_APPSECRET / TCB_ENV_ID 未配置，跳过云同步。"
            exit 0
          fi
          node miniapp/scripts/build-remote-prices.mjs
          node miniapp/scripts/sync-cloudbase-prices.mjs

      - name: Upload minitool artifact
        if: steps.window.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jx3-minitool
          path: "剑网三物价助手-minitool.zip"
