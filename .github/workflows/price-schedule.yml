name: Price schedule

on:
  schedule:
    # 北京时间 08:47–22:47：主任务启动 30 分钟后检查，漏跑/失败时补跑。
    # 修改 cron 表达式也会更新 GitHub 的定时调度注册。
    - cron: '47 0,2,4,6,8,10,12,14 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check recent update and recover if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          hour=$(TZ=Asia/Shanghai date +%H)
          if (( 10#$hour < 8 )); then
            echo 'Outside update window; skip.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # 查询失败时让工作流报错，不能把权限/API 故障当成“无需更新”。
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/update-jx3-prices.yml/runs?branch=main&per_page=30")
          cutoff=$(date -u -d '90 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          recent=$(jq --arg cutoff "$cutoff" '[.workflow_runs[] |
            select(.created_at >= $cutoff) |
            select(.conclusion == "success" or .status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")] | length' <<< "$runs")
          if (( recent > 0 )); then
            echo 'Recent successful or active price update found; no recovery needed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh workflow run update-jx3-prices.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'No successful/active update in the last 90 minutes; dispatched recovery update.' >> "$GITHUB_STEP_SUMMARY"
