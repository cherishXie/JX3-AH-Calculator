name: Price schedule

on:
  schedule:
    # 每天 08:07–22:07（Asia/Shanghai），每 2 小时；00:00–08:00 不更新
    # UTC 对应：00:07, 02:07, 04:07, 06:07, 08:07, 10:07, 12:07, 14:07
    - cron: '7 0,2,4,6,8,10,12,14 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger price update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "update-jx3-prices.yml" --repo "$GITHUB_REPOSITORY" --ref main
