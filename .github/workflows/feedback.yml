name: Create feedback issue

on:
  workflow_dispatch:
    inputs:
      title:
        description: Issue title
        required: true
        type: string
      body:
        description: Issue body
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create issue
        uses: actions/github-script@v7
        env:
          ISSUE_TITLE: ${{ inputs.title }}
          ISSUE_BODY: ${{ inputs.body }}
        with:
          script: |
            const title = String(process.env.ISSUE_TITLE || '').slice(0, 256);
            const body = String(process.env.ISSUE_BODY || '').slice(0, 60000);
            if (!title || !body) {
              core.setFailed('Missing feedback title or body');
              return;
            }
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });
            core.info(`Created feedback issue #${issue.data.number}`);
