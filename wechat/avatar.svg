<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020817"/>
      <stop offset="0.55" stop-color="#081426"/>
      <stop offset="1" stop-color="#0d1b32"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ff3b2f"/>
      <stop offset="0.5" stop-color="#e10600"/>
      <stop offset="1" stop-color="#8f0000"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe89a"/>
      <stop offset="0.45" stop-color="#f5b301"/>
      <stop offset="1" stop-color="#c47c00"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e10600" stop-opacity="0.5"/>
      <stop offset="0.65" stop-color="#e10600" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#e10600" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="badgeShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="boltGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#f5b301" flood-opacity="0.45"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#7aa2d8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#grid)"/>
  <rect x="26" y="26" width="972" height="972" rx="196" fill="none" stroke="#8fb6e8" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="500" cy="560" r="440" fill="url(#glow)"/>

  <!-- red seal -->
  <rect x="160" y="240" width="640" height="640" rx="154" fill="url(#red)" filter="url(#shadow)"/>
  <rect x="188" y="268" width="584" height="584" rx="130" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>
  <text x="480" y="574" text-anchor="middle" dominant-baseline="central"
        font-family="PingFang SC, Hiragino Sans GB, Heiti SC, STHeiti, sans-serif"
        font-size="380" font-weight="700" fill="#ffffff">精</text>

  <!-- energy badge -->
  <circle cx="806" cy="274" r="124" fill="#0b1424" stroke="url(#gold)" stroke-width="12" filter="url(#badgeShadow)"/>
  <path d="M830 168 L748 282 L800 282 L772 360 L862 240 L810 240 Z" fill="url(#gold)" filter="url(#boltGlow)"/>
</svg>
