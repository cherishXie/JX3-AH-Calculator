<!DOCTYPE html>

      <main id="page" tabindex="-1">
        <div class="page boot-page">
          <div class="page-head">

              <p class="page-sub">苍生铸世 50 级 · 生活技艺成本与精力收益计算器</p>

          </div>

          <div class="kpi-grid">

              </div>
            </div>
            <div class="card-body">

              <p class="tiny dim">如果长时间未就绪，请退出后重新打开小工具。</p>
