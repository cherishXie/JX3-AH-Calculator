<!doctype html>
<html lang="zh-CN">
<head>

<style>

  .rank-val b { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .rank-val span { display: block; font-size: 11px; color: var(--muted2); margin-top: 1px; }

  /* ---------- stones ---------- */
  .seg { display: flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 3px; margin-bottom: 12px; }
  .seg div { flex: 1; height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 9px; font-size: 13px; color: var(--muted); }

  .level-row { display: flex; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line); }

  .level-badge { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #08111F; flex: none; margin-right: 12px; }
  .level-name { font-size: 15px; font-weight: 600; }
  .level-meta { font-size: 12px; color: var(--muted2); margin-top: 3px; }
  .level-val { margin-left: auto; text-align: right; }
  .level-val b { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .level-val span { display: block; font-size: 11px; color: var(--muted2); margin-top: 1px; }
  .link-row { height: 64px; display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--line); }
  .link-row:first-of-type { border-top: 0; }
  .link-row .l { flex: 1; }
  .link-row .t { font-size: 15px; font-weight: 600; }
  .link-row .s { font-size: 12.5px; color: var(--muted2); margin-top: 2px; }
  .badge-amber { background: rgba(242,184,75,.12); color: var(--amber); font-size: 12px; padding: 3px 8px; border-radius: 6px; font-weight: 600; }

  /* ---------- recipe ---------- */
  .recipe-hero { background: linear-gradient(155deg, #17243B, #121A2A); border: 1px solid #2A3A55; border-radius: 18px; padding: 18px; margin-bottom: 12px; }
  .light .recipe-hero { background: linear-gradient(155deg, #FFFFFF, #F7FAFF); border-color: #D8E3F2; }
  .recipe-top { display: flex; align-items: flex-start; justify-content: space-between; }
  .recipe-name { font-size: 24px; font-weight: 700; }
  .recipe-meta { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .recipe-num { font-size: 40px; font-weight: 700; letter-spacing: -1px; margin-top: 12px; font-variant-numeric: tabular-nums; }
  .recipe-num .unit { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 7px; letter-spacing: 0; }
  .statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); border-radius: 12px; overflow: hidden; margin-top: 16px; }

  .recipe-hero .btn-primary { margin-top: 16px; }
  .costbar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; margin: 12px 0 9px; }
  .costbar i { display: block; height: 100%; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted2); flex-wrap: wrap; }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .legend em { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

  /* ---------- prices ---------- */
  .price-row { height: 64px; display: flex; align-items: center; border-bottom: 1px solid var(--line); }
  .price-main { flex: 1; min-width: 0; }

  /* ---------- me ---------- */
  .profile { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; background: linear-gradient(150deg, #17243B, #121A2A); border: 1px solid #2A3A55; margin-bottom: 8px; }

  .me-row .ic { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex: none; }
  .me-row .ic.blue { background: rgba(91,156,255,.14); color: var(--accent); }
  .me-row .ic.green { background: rgba(63,214,140,.14); color: var(--green); }
  .me-row .ic.purple { background: rgba(199,155,255,.14); color: var(--purple); }
  .me-row .ic.amber { background: rgba(242,184,75,.14); color: var(--amber); }
  .me-row .l { flex: 1; font-size: 15px; }
  .me-row .r { font-size: 13px; color: var(--muted2); }

  /* ---------- sheet ---------- */
  .overlay { position: absolute; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; z-index: 5; }
  .sheet { width: 100%; background: var(--surface); border-radius: 24px 24px 0 0; border-top: 1px solid var(--border); padding: 8px 20px calc(16px + 34px); }
  .handle { width: 36px; height: 4px; border-radius: 2px; background: var(--border); margin: 0 auto 16px; }

  @media (max-width: 1500px) { body { zoom: 0.8; } }
